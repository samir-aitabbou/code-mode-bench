# Experiment plan. See PLAN.md for the full rationale and hypotheses H1-H7.

seed: 42
gpu_hourly_usd: 0.50

modes: [classic, codemode]

tasks: [T1, T2, T3, T4, T5, T6]

limits:
  max_turns: 15
  max_code_exec_seconds: 120
  # Both raised from 600s/120s on 2026-11-23 after the T5 classic
  # investigation (PROGRESS.md): gpt-oss-20b naturally converges to a
  # correct FINAL_ANSWER at ~670s (just over the old 600s), and
  # qwen3.5-9b's per-product-category list_orders loop hit the old
  # 120s per-request client timeout at 184s of total trial time, well
  # under budget otherwise. The old values risked counting
  # classic-mode trials as failures when they were still genuinely
  # converging -- an artifact of the harness, not a real model
  # difference, and specifically one that would understate classic's
  # success rate relative to Code Mode on the data-heavy tasks.
  max_trial_seconds: 900
  # Raised again 180s -> 400s the same day: qwen3.5-9b's T5-classic 8th
  # request still exceeded 180s (same "Request timed out." at the same
  # 7-requests/61757-tokens/63.6s-so-far point as before 120->180).
  # Confirmed slow-but-progressing, not a hang: at 400s the same
  # request succeeded, taking ~191s (trial finished at 255.0s total,
  # 8 requests, well under the 900s trial budget).
  request_timeout_s: 400
  truncate_output_chars: 8000

vllm:
  enable_prefix_caching: false # disabled for the main measurements, see PLAN.md §5

main_series:
  tasks: [T1, T2, T3, T4, T5, T6]
  repetitions: 10
  tool_count_variant: 12 # the normal 12-tool MCP server

tool_bloat_variant:
  tasks: [T3, T5]
  repetitions: 5
  tool_count_variant: 60 # 12 real tools + 48 noise tools, see src/cmbench/mcp_server/extra_tools.py

paginated_variant:
  # Complementary probe added 2026-11-24 after independent analysis
  # (ANALYSE-CLAUDE.md point A): T4 classic fails 0/20 by construction,
  # since the only available list_invoices tool returns every overdue
  # invoice across all customers in one unbounded call, blowing the
  # context window before the model gets a chance to reason. T4p is the
  # exact same task, served by a `list_invoices` that caps `limit`
  # server-side and reports total_count/has_more, so a classic-mode
  # model that pages through offsets can in principle still succeed.
  # Classic-mode only: codemode already succeeds on T4 with the
  # original (unpaginated) tool, so there is nothing to probe there.
  tasks: [T4p]
  modes: [classic]
  repetitions: 10
  invoices_page_limit: 200

# Total trials per model: 6*2*10 (main) + 2*2*5 (tool bloat) + 1*1*10
# (paginated) = 150. Total trials, 2 models: 300. PLAN.md §6 states 560
# for 4 models (and doesn't mention the paginated_variant probe, added
# after the fact); Gemma 4
# and Qwen3.8-27B were both dropped on 2026-11-22/23 (same underlying
# transformers>=5.0 / CUDA-12.8 driver wall), and a 3rd candidate
# (Qwen3-32B-AWQ) was added then dropped again on 2026-11-23 after an
# empirical VRAM-budget test (see configs/models.yaml and PROGRESS.md)
# -- documented as a deviation from plan in REPORT.md.
