# Model configs for the local models, tested one at a time on a single
# NVIDIA L40S-24Q (~21.7 GB free VRAM). PLAN.md originally specified 4;
# 3 have been dropped (see below), so the benchmark runs with 2 active
# models: gpt-oss-20b, qwen3.5-9b. All facts below (repo id, exact
# quantization, min vLLM version, recommended tool-call parser) were
# verified against the model's Hugging Face card and the official vLLM
# recipe at https://recipes.vllm.ai on 2026-11-22 -- see PROGRESS.md for
# the verification notes and links.
#
# Serving venv:
#   - models 1-4 (this file): ~/code-mode-bench/.venv-vllm, vLLM 0.19.0,
#     installed plainly (`pip install vllm==0.19.0`, no override needed
#     -- its default dependency resolution already picks torch
#     2.10.0+cu128), same venv and version for all 4 models so the
#     comparison is fair. torch.cuda.is_available() verified True, and
#     a real CUDA matmul run, before any model download (see
#     PROGRESS.md).
#   - Why 0.19.0 (the stated floor for Gemma 4 MoE support) and not
#     anything newer: this VM's driver (570.124.06) tops out at CUDA
#     12.8 (confirmed via nvidia-smi). vLLM >= 0.25.0 requires
#     torchcodec>=0.14, which has no cu128 wheel. More fundamentally,
#     vLLM 0.24.0's wheel bundles a native extension
#     (`vllm._C_stable_libtorch`) that is linked against CUDA 13
#     regardless of which torch build it's paired with: with the
#     default torch (2.11.0+cu130), `import vllm` succeeds but
#     torch.cuda.is_available() is False (driver too old for CUDA 13);
#     forcing a cu128 torch build instead makes `import vllm` itself
#     fail with "ImportError: libcudart.so.13: cannot open shared
#     object file". vLLM 0.19.0 predates that bundled extension and
#     has neither problem -- verified empirically with both import and
#     a real on-GPU tensor op.
#   - Samir's pre-existing ~/venv-vllm (vLLM 0.17.1) is NOT used by this
#     project and is never modified.

# Gemma 4 26B-A4B (axteam/gemma-4-26B-A4B-AWQ-4bit) and Qwen3.8-27B-INT4
# (RedHatAI/Qwen3.8-27B-INT4) were DROPPED on 2026-11-22/23, with Samir's
# explicit approval each time, after confirmed hard dependency/architecture
# incompatibilities -- both ultimately the same wall: this VM's GPU driver
# (570.124.06) tops out at CUDA 12.8, so the only vLLM version that can
# actually run on it (0.19.0) pins transformers<5; both models' official
# recipes require transformers>=5.0/5.8.0, which vLLM>=0.24.0 ships but
# bundled with a native extension linked against CUDA 13 that this driver
# cannot use either way (see the vLLM-version investigation above).
#   - Gemma 4: hard crash at load, "Transformers does not recognize this
#     architecture" -- an explicit, immediate failure.
#   - Qwen3.8-27B: NO crash. Loads and runs at full speed with correctly
#     shaped output, but produces consistently incoherent, deterministic
#     garbage for every prompt tested (confirmed via direct curl calls,
#     bypassing the harness entirely) -- with and without --enforce-eager,
#     and with --quantization auto-detected or forced to
#     compressed-tensors explicitly (ruling out a format-detection bug).
#     Two replacement HF quantizations were checked (avyukth/Qwen3.8-27B-
#     AWQ-INT4, barrydeen/Qwen3.8-27B-AWQ-4bit); both use the same
#     compressed-tensors loader family, so switching repos would not have
#     avoided whatever is actually broken. Leading hypothesis: the 16
#     full-attention + 48 Gated DeltaNet hybrid-attention architecture has
#     a native vLLM implementation that silently depends on
#     transformers>=5.8 behavior -- unlike Gemma 4's hard failure, this
#     one fails numerically, not structurally. Not root-caused with 100%
#     certainty, but no actionable fix was found within this GPU's
#     constraints. See PROGRESS.md for the full empirical trail.
# No pip-installable combination of vLLM + transformers satisfies both
# "GPU usable" and "either model's architecture requirements" on this
# hardware. The benchmark proceeds with the 2 remaining models. See
# PROGRESS.md and REPORT.md (Deviations from plan) for details.

models:
  - id: gpt-oss-20b
    order: 1
    repo_id: openai/gpt-oss-20b
    quantization: mxfp4-native
    served_model_name: gpt-oss-20b
    tool_call_parser: openai
    reasoning_parser: null
    enable_auto_tool_choice: true
    max_model_len: 32768
    gpu_memory_utilization: 0.85
    notes: >
      Native MXFP4 MoE weights (21B total / 3.6B active). Already cached
      in ~/.cache/huggingface on the VM. Official vLLM recipe
      (recipes.vllm.ai/openai/gpt-oss-20b) requires vLLM >= 0.10.1 and
      gives: --tensor-parallel-size 1 --tool-call-parser openai
      --enable-auto-tool-choice. No reasoning-parser flag in the recipe.

  - id: qwen3.5-9b
    order: 2
    repo_id: RedHatAI/Qwen3.5-9B-FP8-dynamic
    base_repo_id: Qwen/Qwen3.5-9B
    quantization: fp8-dynamic
    served_model_name: qwen3.5-9b
    tokenizer: Qwen/Qwen3.5-9B
    tool_call_parser: qwen3_coder
    reasoning_parser: qwen3
    enable_auto_tool_choice: true
    trust_remote_code: true
    max_model_len: 32768
    gpu_memory_utilization: 0.85
    notes: >
      FP8 dynamic (weights+activations), ~14 GB on disk (vs 19.3 GB
      BF16), built with LLM Compressor, created with vllm==0.18.1.
      Official vLLM recipe (recipes.vllm.ai/Qwen/Qwen3.5-9B?variant=fp8)
      requires vLLM >= 0.17.0 and gives: --trust-remote-code
      --kv-cache-dtype fp8 --tensor-parallel-size 1
      --enable-auto-tool-choice --tool-call-parser qwen3_coder
      --reasoning-parser qwen3. Known issue: "assert num_cache_lines >=
      batch" -- fix is lowering --max-cudagraph-capture-size (default
      512) if it occurs. Smoke test finding: this repo's
      tokenizer_config.json sets tokenizer_class="TokenizersBackend",
      which vLLM 0.19.0's pinned transformers<5 doesn't know
      ("Tokenizer class TokenizersBackend does not exist"); --trust-remote-code
      doesn't fix it. Worked around by loading the tokenizer from the
      base repo instead (Qwen/Qwen3.5-9B, tokenizer_class=Qwen2Tokenizer)
      via --tokenizer -- the quantized repo's weights are unaffected.

  # gemma-4-26b-a4b and qwen3.8-27b: DROPPED (see the note above the
  # `models:` key for the full story).

  # qwen3-32b-awq: ADDED 2026-11-23 as a 3rd model, then DROPPED the
  # same day (Samir's approval) after an empirical VRAM-budget test:
  # Qwen/Qwen3-32B-AWQ's own weights load fine (19 GB on disk, no
  # architecture/transformers-version risk, unlike Qwen3.8-27B) but
  # consume ~18.6 GiB of this GPU's ~20.8 GiB usable budget on their
  # own. Raising gpu_memory_utilization above ~0.877 fails outright at
  # engine init ("Free memory on device cuda:0 (20.84/23.76 GiB) ...
  # less than desired"), and at the highest value that survives that
  # check, vLLM's own KV-cache sizing error put the realistic ceiling
  # at roughly max_model_len=9000 ("ValueError: To serve at least one
  # request with the models's max seq len (16384), 4.0 GiB KV cache is
  # needed, which is larger than the available KV cache memory
  # (1.57 GiB) ... estimated maximum model length is 6416" at
  # max_model_len=16384/gpu_memory_utilization=0.85). That is well
  # below the ~21,000-46,000-token prompts already observed on T3/T4/T5
  # with the other 2 models -- this model would fail those tasks via
  # context_overflow almost immediately, for a VRAM-budget reason
  # unrelated to its actual capability, which would make it an invalid
  # comparison point rather than a useful 3rd data point. No smaller
  # replacement model was substituted; the benchmark proceeds with the
  # 2 remaining models. See PROGRESS.md and REPORT.md (Deviations from
  # plan) for details.
