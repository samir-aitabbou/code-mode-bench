[project]
name = "cmbench"
version = "0.1.0"
description = "Code Mode vs classic MCP tool-calling: a benchmark on 4 local LLMs served by vLLM"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Samir Ait-Abbou", email = "samir.1.aitabbou@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "openai>=1.40",
    "mcp>=1.2",
    "pyyaml>=6.0",
    "faker>=26.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pandas-stubs",
]

[project.scripts]
cmbench = "cmbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# typer's `param: T = typer.Option(...)` pattern is the documented API,
# not a mutable-default-argument bug.
"src/cmbench/cli.py" = ["B008"]
# REPORT.md's prose and markdown-table rows are literal content, not code --
# wrapping them at 100 chars would make the rendered report harder to read,
# not easier.
"src/cmbench/report/render.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cmbench"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
